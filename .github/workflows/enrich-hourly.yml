name: enrich-hourly

# 临时冲刺:每小时一个 s7 小时窗(断点接力,未到期零调用),剩余 ~2.5 万 tail 仓
# 每窗 ~3400 仓(75 调用/分钟 × 45 分钟),约 8 个小时窗收完全部到期目标。
# 富集全部完成后删除本文件(或注释掉 schedule)即可停。
on:
  schedule:
    - cron: "17 0-12,14-23 * * *"  # 每小时第 17 分:避整点 GHA 排队拥挤(同 atlas :17 修法);
                                   # 与 collect 的互斥仍由共组 state-writer 保证,cron 无需避让
  workflow_dispatch: {}             # 手动可触发

permissions:
  contents: write

concurrency:
  group: state-writer            # 与 collect.yml 共组:写 main 的 workflow 互斥串行
                                  # (10-20 事故根因:两窗并行写 main,push 对撞)
  cancel-in-progress: false      # collect 5h 窗内本表多窗被折叠为最新 1 个 pending,冲刺变慢不丢数据

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PROXY: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 45 分钟自限时 + 0 跨窗等待:配额触保即优雅退出,接力交给下一小时窗
      # (:17 起跑避整点 GHA 排队;配额触保退出逻辑不变)
      - name: s7 富集(小时窗,断点接力)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python s7_enrich.py --tier all
          --max-calls 5000 --max-minutes 45 --wait-windows 0 --workers 6

      - name: commit & push
        if: always()   # 配额触保/超时退出也保住本窗断点
        run: |
          git config user.name "ai-collect-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本窗无变化,跳过提交"
          else
            git commit -m "enrich: $(date -u +%F) 小时窗接力(剩余到期见日志)"
            for i in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase --autostash origin/main; then
                # 撞车分流:富集台账/侧车按 fn/dim_ts 并集合并,两窗数据都保
                # (与 collect.yml 同款修复,10-16 事故教训:严禁整文件取本窗)
                git diff --name-only --diff-filter=U -z | while IFS= read -r -d '' p; do
                  case "$p" in
                    state/enrich_cache_shards/*.json|state/enrich_state.json)
                      python tools/merge_state_json.py --path "$p" --tie theirs \
                        || git checkout --theirs -- "$p" ;;
                    *)
                      git checkout --theirs -- "$p" ;;
                  esac
                done
                git diff --name-only --diff-filter=U -z | xargs -0 -r git add
                # 10-21 事故修复:同 collect.yml——CRLF 幻影脏文件会误杀
                # rebase --continue,全量暂存兜底;仍败则保底推备份分支
                git add -A
                echo "== continue 前诊断:剩余未合并/工作区脏文件 =="
                git ls-files -u | awk '{print $4}' | sort -u | head -5
                git diff --name-only | head -5
                if ! GIT_EDITOR=true git rebase --continue; then
                  d=$(date -u +%Y%m%d)
                  git push origin "HEAD:refs/heads/enrich-lost-$d" || true
                  echo "::error::rebase --continue 失败,本窗提交已保底推至 enrich-lost-$d"
                  exit 1
                fi
              fi
              git push origin HEAD:main && { echo "已推送"; exit 0; }
              echo "推送撞车,40s 后重试($i/5)"; sleep 40
            done
            d=$(date -u +%Y%m%d)
            git push origin "HEAD:refs/heads/enrich-lost-$d" || true
            echo "::warning::推送 5 次未成,本窗提交已保底推至 enrich-lost-$d,下一小时窗续跑" >&2
            exit 1
          fi
