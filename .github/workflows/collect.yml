name: collect

on:
  schedule:
    - cron: "0 13 * * *"   # UTC 13:00 = 北京 21:00
  workflow_dispatch:        # 支持手动触发(可勾选强制月度校准)
    inputs:
      force_monthly:
        description: '强制 README 走月度全量校准(不受 1 号限制;calibrated 按日标记跨窗接力不重烧)'
        type: boolean
        default: false

permissions:
  contents: write           # 采完 commit + push 回仓库

concurrency:
  group: state-writer           # 与 enrich-hourly 共组:写 main 的 workflow 互斥串行
                                 # (10-20 事故:两窗并行写,collect push 前 2.5min 被 hourly 顶掉,
                                 #  rebase 248 冲突 + CRLF 幻影脏文件压死 continue,整晚数据丢)
  cancel-in-progress: false # 同一时刻只跑一个,后到的排队(旧的 pending 被新 pending 替换)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # 平台单 job 上限 6h,各步骤按此自计时
    env:
      PROXY: ""             # Actions runner 直连,不走 Clash
      PYTHONUNBUFFERED: "1" # 实时日志:Python 管道输出默认块缓冲,不加它运行中的步骤一行都看不到
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 池数据历史完整保留

      - name: 记录 job 起点(供 README 步骤算剩余时间预算)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install zstandard   # 快照归档打包用

      # 池采集:断点续采(collect_state 按单元记完成)+ 墙钟预算,
      # 预算截断夜 s5 门控拒合并,明晚自动续齐(防假 out)
      # 预算依据 10-16 实测:s1 全量 ~163 分钟(搜索 30 次/分钟硬顶,~4400 查询),
      # 给 175 分钟保证单窗跑完——门控要求单元当日全齐,池阶段超时=池冻结
      - name: s4 新项目窗口(最先跑:45 天窗口每天在流失,最易腐烂)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python s4_collect_new.py --max-minutes 20

      - name: s1 topic 通道(>1000 自动拆分)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python s1_collect_topics.py --max-minutes 175

      - name: s2 org 通道 + s3 watch 白名单
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python s2_collect_orgs.py --max-minutes 15
          python s3_collect_watch.py

      - name: s5 合并(完成门控/分片/事件/瘦身快照)
        run: python s5_merge_pool.py

      # 顺序即配额策略(对齐 dbhub):富集慢节奏先行吃满滚动小时窗;
      # README 放最后,Core 触保底线睡到下一小时窗再续,不被挤成 0 完成。
      # 富集 100 分钟 = 6h 窗扣除池阶段(~195min)与 README 后的余量,
      # 首轮 ~17 万调用按 ~7k/晚铺,约 25 晚;稳态 ~30 分钟收工
      # ENRICH_SKIP=true 时整步跳过(本地富集窗期间暂停远端,防两边重复烧;
      # 本地窗收工后把变量改回 false 或删掉即恢复,无需改代码)
      - name: s7 富集(分层增量:未到期零调用,到期才采)
        if: false   # 临时暂停(2026-10-21):富集由 enrich-hourly 小时窗冲刺接力,
                    # 夜间窗不再烧富集配额;冲刺收工后改回 vars.ENRICH_SKIP != 'true' 即恢复
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python s7_enrich.py --tier all
          --max-calls 5000 --max-minutes 100 --wait-windows 8 --workers 6

      # README_SKIP=true 时整步跳过(本地回填期间暂停远端采集,防两边重复;
      # 回填推完用 API 把变量改回 false 或删掉即恢复,无需改代码)
      - name: s6 README(weekly;每月 1 号自动转月度全量校准)
        if: vars.README_SKIP != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE=weekly; [ "$(date -u +%d)" = "01" ] && MODE=monthly
          [ "${{ github.event.inputs.force_monthly }}" = "true" ] && MODE=monthly
          echo "README 模式: $MODE(force_monthly=${{ github.event.inputs.force_monthly || 'false' }})"
          REM=$(( 360*60 - ($(date +%s) - JOB_T0) - 600 ))
          [ "$REM" -lt 300 ] && REM=300
          echo "README 本窗总预算 $(( REM / 60 )) 分钟"
          python s6_fetch_readmes.py --mode "$MODE" \
            --max-calls 4200 --max-minutes 60 \
            --wait-windows 10 --max-total-minutes $(( REM / 60 ))

      - name: 出池仓 absent_since 打戳(每晚,零 API 只写台账)
        run: python tools/purge_outpool.py --stamp || echo "::warning::absent_since 打戳失败(不影响当晚采集数据)"

      - name: 出池仓清理 dry-run 清单(每月 1 号,人工过目后本地 --apply)
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            python tools/purge_outpool.py || echo "::warning::purge dry-run 失败(不影响当晚采集数据)"
          else
            echo "非月初,跳过"
          fi

      # 滚动归档:≥15 天的快照目录打包上 Releases(按月 archive-YYYY-MM),
      # 远端 digest 一致才删本地目录;失败只警告不阻断(次晚重试补漏,幂等)
      - name: 快照滚动归档(≥15 天 → Releases)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/release_archive.py rotate --apply || echo "::warning::滚动归档失败(次晚自动补漏)"
          rm -rf _archive_tmp

      - name: commit & push
        if: always()   # 采集步骤失败也保住已完成步骤的数据
        run: |
          git config user.name "ai-collect-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "今日无变化,跳过提交"
          else
            git commit -m "collect: $(date -u +%Y-%m-%d) 池/事件/富集/README 日更"
            for i in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase --autostash origin/main; then
                # 撞车分流:富集台账/侧车按 fn/dim_ts 并集合并,两窗数据都保
                # (10-16 事故是整文件取本窗,顶掉前窗 843 仓台账);
                # 其余文件维持原策略:rebase 语义反转,--theirs 才是本窗提交
                git diff --name-only --diff-filter=U -z | while IFS= read -r -d '' p; do
                  case "$p" in
                    state/enrich_cache_shards/*.json|state/enrich_state.json)
                      python tools/merge_state_json.py --path "$p" --tie theirs \
                        || git checkout --theirs -- "$p" ;;
                    *)
                      git checkout --theirs -- "$p" ;;
                  esac
                done
                git diff --name-only --diff-filter=U -z | xargs -0 -r git add
                # 10-21 事故修复:rebase 重建 index 后 CRLF 规范化差异会让无关文件
                # 呈"未暂存改动",rebase --continue 的 has_unstaged_changes 检查
                # 误报"edit all merge conflicts"并退出 → 全量暂存兜底
                git add -A
                echo "== continue 前诊断:剩余未合并/工作区脏文件 =="
                git ls-files -u | awk '{print $4}' | sort -u | head -5
                git diff --name-only | head -5
                if ! GIT_EDITOR=true git rebase --continue; then
                  # continue 仍失败:整晚成果不陪葬,推备份分支留人工合并
                  d=$(date -u +%Y%m%d)
                  git push origin "HEAD:refs/heads/collect-lost-$d" || true
                  echo "::error::rebase --continue 失败,本窗提交已保底推至 collect-lost-$d"
                  exit 1
                fi
              fi
              git push origin HEAD:main && { echo "已推送"; exit 0; }
              echo "推送撞车,40s 后重试($i/5)"; sleep 40
            done
            d=$(date -u +%Y%m%d)
            git push origin "HEAD:refs/heads/collect-lost-$d" || true
            echo "::warning::推送 5 次未成功,本窗提交已保底推至 collect-lost-$d(断点续采次晚重做)"
          fi
